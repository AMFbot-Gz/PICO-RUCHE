name: CI — PICO-RUCHE

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Node.js tests ─────────────────────────────────────────────────────────
  test-node:
    name: Node.js tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --forceExit --detectOpenHandles
        env:
          NODE_ENV: test
          STANDALONE_MODE: "true"
          OLLAMA_HOST: "http://localhost:11434"
          HITL_TIMEOUT_SECONDS: "5"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-results
          path: coverage/
          retention-days: 7

  # ── Python lint ───────────────────────────────────────────────────────────
  lint-python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check agent/ --ignore E501,E402

  # ── Smoke tests ───────────────────────────────────────────────────────────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [test-node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test:smoke --if-present
        env:
          NODE_ENV: test
          STANDALONE_MODE: "true"

  # ── Security audit ────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm audit --audit-level=moderate --production || true
